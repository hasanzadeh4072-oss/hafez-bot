<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <script src="https://app.splus.ir/js/soroush-web-app.js"></script>

    <title>فال حافظ</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <main class="app">

        <!-- صفحه اصلی -->
        <section id="homeScreen" class="screen active">

            <div class="logo">🌿</div>

            <h1>فال حافظ</h1>

            <p class="intention">
                نیت خویش را در دل بگذرانید، صلواتی نثار روان حافظ کنید<br>
                و آنگاه دیوانش را بگشایید.
            </p>

            <button
                id="fortuneButton"
                class="primary-btn"
                type="button"
            >
                ✨ گرفتن فال حافظ
            </button>

        </section>


        <!-- صفحه فال -->
        <section id="fortuneScreen" class="screen">

            <div class="fortune-card">

                <h2 id="poemTitle"></h2>

                <div
                    id="poemText"
                    class="poem"
                ></div>

                <div
                    id="poemSource"
                    class="source"
                ></div>


                <!-- صوت -->
                <div
                    id="audioSection"
                    class="audio-section"
                    style="display:none;"
                >

                    <button
                        id="audioButton"
                        class="audio-btn"
                        type="button"
                    >
                        ▶️ پخش صوت غزل
                    </button>

                    <div
                        id="audioStatus"
                        class="audio-status"
                    ></div>

                </div>


                <div class="divider"></div>


                <h3>تعبیر فال</h3>

                <div
                    id="interpretation"
                    class="interpretation"
                >
                    در حال آماده‌سازی تعبیر...
                </div>

            </div>


            <div class="intention new-fortune-hint">
                برای فال مجدد، نیت خویش را در دل بگذرانید، صلواتی نثار روان حافظ کنید<br>
                و آنگاه فال دوباره را بزنید.
            </div>


            <button
                id="newFortuneButton"
                class="primary-btn"
                type="button"
            >
                🔄 فال دوباره
            </button>

        </section>

    </main>


    <script src="./app.js"></script>

</body>
</html>
